              - paragraph [ref=f67e101]:
                - strong [ref=f67e102]: ПЕРЕЧЕНЬ НА 2021 ГОД
              - paragraph [ref=f67e103]:
                - text: Определен
                - link "постановлением Правительства Москвы от 28.11.2014 № 700-ПП" [ref=f67e104] [cursor=pointer]:
                  - /url: https://www.mos.ru/depr/documents/normativno-pravovye-akty-po-uplate-naloga-na-imushchestvo-organizatcii-ot-kadastrovoi-stoimosti/view/159226220/
                - text: «Об определении перечня объектов недвижимого имущества, в отношении которых налоговая база определяется как их кадастровая стоимость» с изменениями, внесенными постановлением Правительства Москвы от 24.11.2020 № 2044-ПП и вступившими в силу с 1 января 2021 года.
              - paragraph [ref=f67e105]
              - paragraph [ref=f67e106]: "В Перечень на 2021 год включены:"
              - list [ref=f67e107]:
                - listitem [ref=f67e108]:
                  - paragraph [ref=f67e109]: 20 554 нежилых здания любой площади на земельных участках с видом разрешенного использования для размещения офисных объектов или объектов торговли, общепита и (или) бытового обслуживания;
                - listitem [ref=f67e110]:
                  - paragraph [ref=f67e111]: "15 101 объект с видом фактического использования для размещения офисных объектов или объектов торговли, общепита и (или) бытового обслуживания:"
              - list [ref=f67e112]:
                - listitem [ref=f67e113]:
                  - list [ref=f67e114]:
                    - listitem [ref=f67e115]: 3 347 нежилых зданий (и помещений в них) площадью свыше 1 тыс. м²;
                    - listitem [ref=f67e116]: 11 754 нежилых помещения, расположенных в многоквартирных домах, общая площадь нежилых помещений в которых превышает 3 тыс. м²;
                - listitem [ref=f67e117]:
                  - paragraph [ref=f67e118]:
                    - text: 426 нежилых зданий и нежилых помещений в зданиях, включенных в Перечень пешеходных зон (утвержден
                    - link "постановлением Правительства Москвы от 16.03.2016 № 78-ПП" [ref=f67e119] [cursor=pointer]:
                      - /url: https://www.mos.ru/depr/documents/normativno-pravovye-akty-goroda-moskvy/view/160111220
                    - text: ), с видом фактического использования или назначением по документам БТИ для размещения офисных объектов или объектов торговли, общепита и (или) бытового обслуживания.
              - paragraph [ref=f67e120]

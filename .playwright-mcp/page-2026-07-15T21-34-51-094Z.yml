              - paragraph [ref=f67e252]: "Всего в Перечне на 2016 год:"
              - list [ref=f67e253]:
                - listitem [ref=f67e254]:
                  - paragraph [ref=f67e255]: 7 183 объекта;
                - listitem [ref=f67e256]:
                  - paragraph [ref=f67e257]: 70,3 млн м².
              - paragraph [ref=f67e258]
              - paragraph [ref=f67e259]:
                - strong [ref=f67e260]: ПЕРЕЧЕНЬ НА 2015 ГОД
              - paragraph [ref=f67e261]:
                - text: Определен
                - link "постановлением Правительства Москвы от 28.11.2014 № 700-ПП" [ref=f67e262] [cursor=pointer]:
                  - /url: https://www.mos.ru/depr/documents/normativno-pravovye-akty-po-uplate-naloga-na-imushchestvo-organizatcii-ot-kadastrovoi-stoimosti/view/159226220/
                - text: «Об определении Перечня объектов недвижимого имущества, в отношении которых налоговая база определяется как их кадастровая стоимость», на 2015 год и последующие налоговые периоды.
              - paragraph [ref=f67e263]
              - paragraph [ref=f67e264]: "В Перечень на 2015 год включены:"
              - list [ref=f67e265]:
                - listitem [ref=f67e266]:
                  - paragraph [ref=f67e267]: 1 679 объектов недвижимости площадью свыше 3 тыс. м², расположенных на земельных участках с видом разрешенного использования для размещения офисных объектов или объектов торговли, общепита и (или) бытового обслуживания;
                - listitem [ref=f67e268]:
                  - paragraph [ref=f67e269]: "3 707 объектов недвижимости, фактически используемых для размещения офисных объектов или объектов торговли, общепита и (или) бытового обслуживания, из них:"
                  - list [ref=f67e270]:
                    - listitem [ref=f67e271]: 3 610 нежилых зданий (и помещений в них) площадью свыше 2 тыс. м²;
                    - listitem [ref=f67e272]: 97 нежилых помещений площадью свыше 3 тыс. м² в жилых домах.
              - paragraph [ref=f67e273]
              - paragraph [ref=f67e274]: "Всего в Перечне на 2015 год:"
              - list [ref=f67e275]:
                - listitem [ref=f67e276]:
                  - paragraph [ref=f67e277]: 5 386 объектов;
                - listitem [ref=f67e278]:
                  - paragraph [ref=f67e279]: 54,6 млн м².

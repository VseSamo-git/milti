    - heading "Включен ли ваш объект в утвержденный перечень объектов недвижимости" [level=1] [ref=f49e4]
    - paragraph [ref=f49e5]: Сервис для поиска объектов недвижимого имущества, по которым налог на имущество исчисляется от кадастровой стоимости
    - paragraph [ref=f49e6]: Уважаемые налогоплательщики!
    - paragraph [ref=f49e7]: Данный сервис предназначен для поиска объектов недвижимого имущества, включенных в Перечень торговых, офисных объектов, объектов общественного питания и (или) бытового обслуживания, облагаемых налогом на имущество от кадастровой стоимости.
    - paragraph [ref=f49e8]: "В случае если Вам принадлежит:"
    - paragraph [ref=f49e9]:
      - list [ref=f49e10]:
        - listitem [ref=f49e11]: • нежилое здание, поиск осуществляется по кадастровому номеру здания;
        - listitem [ref=f49e12]: • нежилое помещение в нежилом здании, поиск осуществляется по кадастровому номеру здания, в котором расположено данное помещение;
        - listitem [ref=f49e13]: • встроенно-пристроенное нежилое помещение в многоквартирном доме, поиск осуществляется по кадастровому номеру помещения.
    - paragraph [ref=f49e14]: В настоящее время в данном сервисе содержатся утвержденные Перечни на 2014 – 2026 годы.
    - paragraph [ref=f49e15]:
      - text: Ознакомиться с критериями, по которым объекты недвижимости включаются в Перечень, порядком налогообложения, ставками, льготами по налогу на имущество от кадастровой стоимости можно на официальном сайте Мэра Москвы в разделе
      - link "Власть // Органы власти // Департамент экономической политики и развития города Москвы // Деятельность // Налог на имущество организаций от кадастровой стоимости" [ref=f49e16] [cursor=pointer]:

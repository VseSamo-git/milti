          - generic [ref=f7e96]:
            - generic [ref=f7e97] [cursor=pointer]: назад
            - heading "Налог от кадастровой стоимости. Объекты налогообложения" [level=2] [ref=f7e98]
            - generic [ref=f7e99]:
              - paragraph [ref=f7e100]
              - paragraph [ref=f7e101]: "С 1 января 2014 года налогом на имущество организаций от кадастровой стоимости облагается:"
              - list [ref=f7e102]:
                - listitem [ref=f7e103]:
                  - paragraph [ref=f7e104]: недвижимое имущество, предназначенное или фактически используемое для размещения торгово-офисных объектов, объектов общественного питания и (или) бытового обслуживания, включенное в Перечень объектов, в отношении которых налог на имущество организаций уплачивается от их кадастровой стоимости (далее — Перечень);
                - listitem [ref=f7e105]:
                  - paragraph [ref=f7e106]: недвижимое имущество иностранных организаций, вне зависимости от включения в Перечень.
              - paragraph [ref=f7e107]: С 1 января 2016 года объектом налогообложения также стали жилые дома и жилые помещения, не учитываемые на балансе в качестве объектов основных средств более двух лет, вне зависимости от включения в Перечень.
              - paragraph [ref=f7e108]: "С 1 января 2021 года от кадастровой стоимости также облагаются объекты недвижимости, вне зависимости от включения в Перечень:"
              - list [ref=f7e109]:
                - listitem [ref=f7e110]:
                  - paragraph [ref=f7e111]: жилые помещения, гаражи и машино-места, учитываемые на балансе в качестве объектов основных средств;
                - listitem [ref=f7e112]:
                  - paragraph [ref=f7e113]: гаражи и машино-места, не учитываемые на балансе в качестве объектов основных средств более двух лет;
                - listitem [ref=f7e114]:
                  - paragraph [ref=f7e115]: объекты незавершенного строительства;
                - listitem [ref=f7e116]:
                  - paragraph [ref=f7e117]: жилые строения, садовые дома, хозяйственные строения или сооружения, расположенные на земельных участках, предоставленных для ведения личного подсобного хозяйства, огородничества, садоводства или индивидуального жилищного строительства.
              - paragraph [ref=f7e118]
              - paragraph [ref=f7e119]:
                - strong [ref=f7e120]: Перечень облагаемых объектов
              - paragraph [ref=f7e121]: "Правительство Москвы ежегодно до 30 ноября формирует Перечень объектов недвижимого имущества:"
              - list [ref=f7e122]:
                - listitem [ref=f7e123]:
                  - paragraph [ref=f7e124]:
                    - text: Перечень на 2014 год —
                    - link "постановление Правительства Москвы от 29.11.2013 № 772-ПП" [ref=f7e125] [cursor=pointer]:
                      - /url: https://www.mos.ru/depr/documents/normativno-pravovye-akty-po-uplate-naloga-na-imushchestvo-organizatcii-ot-kadastrovoi-stoimosti/view/159227220/
                - listitem [ref=f7e126]:
                  - paragraph [ref=f7e127]:
                    - text: Перечни с 2015 года —
                    - link "постановление Правительства Москвы от 28.11.2014 № 700-ПП" [ref=f7e128] [cursor=pointer]:
                      - /url: https://www.mos.ru/depr/documents/normativno-pravovye-akty-po-uplate-naloga-na-imushchestvo-organizatcii-ot-kadastrovoi-stoimosti/view/159226220/
              - paragraph [ref=f7e129]
              - paragraph [ref=f7e130]:
                - strong [ref=f7e131]: ПЕРЕЧЕНЬ НА 2022 ГОД
              - paragraph [ref=f7e132]:
                - text: Определен
                - link "постановлением Правительства Москвы от 28.11.2014 № 700-ПП" [ref=f7e133] [cursor=pointer]:
                  - /url: https://www.mos.ru/depr/documents/normativno-pravovye-akty-po-uplate-naloga-na-imushchestvo-organizatcii-ot-kadastrovoi-stoimosti/view/159226220/
                - text: «Об определении перечня объектов недвижимого имущества, в отношении которых налоговая база определяется как их кадастровая стоимость» с изменениями, внесенными постановлением Правительства Москвы от 23.11.2021 № 1833-ПП и вступившими в силу с 1 января 2022 года.
              - paragraph [ref=f7e134]
              - paragraph [ref=f7e135]: "В Перечень на 2022 год включены:"
              - list [ref=f7e136]:
                - listitem [ref=f7e137]:
                  - paragraph [ref=f7e138]: 20 203 нежилых зданий любой площади на земельных участках с видом разрешенного использования для размещения офисных объектов или объектов торговли, общепита и (или) бытового обслуживания;
                - listitem [ref=f7e139]:
                  - paragraph [ref=f7e140]: "16 759 объектов с видом фактического использования для размещения офисных объектов или объектов торговли, общепита и (или) бытового обслуживания:"
                  - list [ref=f7e141]:
                    - listitem [ref=f7e142]: 3 239 нежилых зданий (и помещений в них) площадью свыше 1 тыс. м²;
                    - listitem [ref=f7e143]: 13 520 нежилых помещений, расположенных в многоквартирных домах, общая площадь нежилых помещений в которых превышает 3 тыс. м²;
                - listitem [ref=f7e144]:
                  - paragraph [ref=f7e145]:
                    - text: 454 нежилых зданий и нежилых помещений в зданиях, включенных в Перечень пешеходных зон (утвержден
                    - link "постановлением Правительства Москвы от 16.03.2016 № 78-ПП" [ref=f7e146] [cursor=pointer]:
                      - /url: https://www.mos.ru/depr/documents/normativno-pravovye-akty-goroda-moskvy/view/160111220
                    - text: ), с видом фактического использования или назначением по документам БТИ для размещения офисных объектов или объектов торговли, общепита и (или) бытового обслуживания.
              - paragraph [ref=f7e147]
              - paragraph [ref=f7e148]: "Всего в Перечне на 2022 год:"
              - list [ref=f7e149]:
                - listitem [ref=f7e150]:
                  - paragraph [ref=f7e151]: 37 416 объект;
                - listitem [ref=f7e152]:
                  - paragraph [ref=f7e153]: 96,3 млн м².
              - paragraph [ref=f7e154]
              - paragraph [ref=f7e155]:
                - text: С Перечнем вы можете ознакомиться
                - link "на сайте" [ref=f7e156] [cursor=pointer]:
                  - /url: https://www.mos.ru/depr/function/nalogovaya-politika/vklyuchen-li-vash-obekt-v-utverzhdennyy-perechen-obektov-nedvizhimosti/
                - text: Мэра Москвы.
              - paragraph [ref=f7e157]: Если принадлежащий вам объект недвижимости находится в Перечне, значит, на момент формирования Перечня данный объект соответствует критериям, по которым он должен облагаться налогом на имущество от кадастровой стоимости.
              - paragraph [ref=f7e158]: В случае если вам принадлежит нежилое помещение в нежилом здании, то в Перечне необходимо осуществлять поиск здания, в котором расположено данное помещение.
              - paragraph [ref=f7e159]:
                - text: Проверьте, находится ли ваш объект в Перечне! (
                - link "см. здесь" [ref=f7e160] [cursor=pointer]:
                  - /url: https://www.mos.ru/depr/function/nalogovaya-politika/vklyuchen-li-vash-obekt-v-utverzhdennyy-perechen-obektov-nedvizhimosti/
                - text: ).
              - paragraph [ref=f7e161]
              - table [ref=f7e163]:
                - rowgroup [ref=f7e164]:
                  - row [ref=f7e165]:
                    - cell [ref=f7e166]:
                      - link "Перечни объектов налогообложения прошлых лет" [ref=f7e167] [cursor=pointer]:
                        - /url: https://www.mos.ru/depr/perecheni-proshlykh-let
              - paragraph [ref=f7e168]
              - paragraph [ref=f7e169]:
                - strong [ref=f7e170]: Какие объекты включены в Перечень на 2022 год?
              - paragraph [ref=f7e171]: "В Перечень на 2022 год включены объекты, соответствующие одному из следующих условий:"
              - list [ref=f7e172]:
                - listitem [ref=f7e173]:
                  - paragraph [ref=f7e174]: здание расположено на земельном участке с видом разрешенного использования, включающим размещение офисов, объектов торговли, бытового обслуживания, общественного питания;
                - listitem [ref=f7e175]:
                  - paragraph [ref=f7e176]:
                    - text: нежилое здание (площадью свыше 1 тыс. м²) либо нежилое помещение в жилом доме (если совокупная площадь нежилых помещений превышает 3 тыс. м²) фактически используется не менее чем на 20% общей площади для офисов, объектов торговли, бытового обслуживания, общественного питания согласно акту
                    - link "Госинспекции по недвижимости" [ref=f7e177] [cursor=pointer]:
                      - /url: https://www.mos.ru/ggi/function/opredelenie-fakticheskogo-ispolzovanie-obektov-nedvizhimosti/rezultaty-inspekcionnykh-meropriyatij/
                    - text: ;
                - listitem [ref=f7e178]:
                  - paragraph [ref=f7e179]:
                    - text: нежилое здание либо нежилое помещение, расположенное на пешеходных зонах (список таких зон см.
                    - link "здесь" [ref=f7e180] [cursor=pointer]:
                      - /url: https://www.mos.ru/depr/documents/normativno-pravovye-akty-goroda-moskvy/view/160111220
                    - text: ), фактически используется не менее чем на 20% общей площади для размещения офисов, объектов торговли, бытового обслуживания, общественного питания согласно акту Госинспекции по недвижимости, либо имеет соответствующее назначение в документах технического учета.
              - paragraph [ref=f7e181]
              - paragraph [ref=f7e182]:
                - strong [ref=f7e183]: Где получить информацию
              - paragraph [ref=f7e184]:
                - text: Проверить, включен ли объект недвижимости в Перечень, можно
                - link "на сайте" [ref=f7e185] [cursor=pointer]:
                  - /url: https://www.mos.ru/depr/function/nalogovaya-politika/vklyuchen-li-vash-obekt-v-utverzhdennyy-perechen-obektov-nedvizhimosti/
                - text: Мэра Москвы.
              - paragraph [ref=f7e186]:
                - text: "По вопросам, связанным с включением объектов в Перечень, обращайтесь в Департамент экономической политики и развития города Москвы. Обращения принимаются по адресу: 125032, Москва, Вознесенский переулок, д. 21 или через раздел «"
                - link "Электронная приемная" [ref=f7e187] [cursor=pointer]:
                  - /url: https://www.mos.ru/feedback/reception/
                - text: » на сайте Мэра Москвы.
              - paragraph [ref=f7e188]
              - paragraph [ref=f7e189]:
                - strong [ref=f7e190]: Как определить, по какому критерию объект был включен в Перечень?
              - paragraph [ref=f7e191]:
                - text: В результатах поиска объекта недвижимости в
                - link "сервисе" [ref=f7e192] [cursor=pointer]:
                  - /url: https://www.mos.ru/depr/function/nalogovaya-politika/vklyuchen-li-vash-obekt-v-utverzhdennyy-perechen-obektov-nedvizhimosti/
                - text: указывается информация о том, по какому критерию объект недвижимого имущества включен в Перечень. Обращаем внимание, что в сервисе отражается только один из критериев, по которым объект включен в Перечень, хотя объект может соответствовать нескольким критериям одновременно.
              - paragraph [ref=f7e193]:
                - text: Проверить, проводилось ли обследование Госинспекцией по недвижимости, можно в разделе «
                - link "Результаты инспекционных мероприятий" [ref=f7e194] [cursor=pointer]:
                  - /url: https://www.mos.ru/ggi/function/opredelenie-fakticheskogo-ispolzovanie-obektov-nedvizhimosti/rezultaty-inspekcionnykh-meropriyatij/
                - text: ».
              - paragraph [ref=f7e195]: Если обследование не проводилось, значит, объект недвижимости включен в Перечень на основании вида разрешенного использования земельного участка либо документов технического учета для объектов, расположенных на пешеходных зонах (подробнее о критериях см. выше).
              - paragraph [ref=f7e196]:
                - text: Обратиться в Департамент экономической политики и развития города Москвы за разъяснениями, по каким критериям ваш объект недвижимости был включен в Перечень, а также узнать о порядке его налогообложения и возможных льготах (
                - link "подробнее" [ref=f7e197] [cursor=pointer]:
                  - /url: https://www.mos.ru/feedback/reception/
                - text: ).
              - paragraph [ref=f7e198]:
                - text: Ознакомиться с порядком налогообложения вашего объекта недвижимости налогом на имущество, уплачиваемым от кадастровой стоимости, можно в разделе «
                - link "Как уплачивать налог и отчитываться по нему?" [ref=f7e199] [cursor=pointer]:
                  - /url: https://www.mos.ru/depr/function/nalogovaya-politika/nalog-ot-kadastrovoj-stoimosti/how-to-pay-tax/
                - text: ».
              - paragraph [ref=f7e200]
              - paragraph [ref=f7e201]:
                - strong [ref=f7e202]: Что делать, если вы не согласны с включением объекта недвижимости в Перечень?
              - paragraph [ref=f7e203]:
                - text: Проверьте, соответствует ли ваш объект недвижимости критериям налогообложения от кадастровой стоимости. Если фактически объект не соответствует критериям, однако документально это не оформлено, вам необходимо осуществить действия, описанные ниже.
                - strong [ref=f7e204]: Обратите внимание на сроки!
              - paragraph [ref=f7e205]: Определить, по какому критерию объект был включен в Перечень (см. выше).
              - paragraph [ref=f7e206]: "В случае если здание было включено в Перечень, поскольку вид разрешенного использования земельного участка предусматривает размещение офисов, объектов торговли, бытового обслуживания, общественного питания, но данный участок фактически не используется под заявленные цели, вы можете:"
              - list [ref=f7e207]:
                - listitem [ref=f7e208]:
                  - paragraph [ref=f7e209]:
                    - text: обратиться в Департамент городского имущества города Москвы в ближайшее время для исключения указанных видов размещения из вида разрешенного использования земельного участка (для земли, находящейся в собственности города Москвы или государственная собственность на которую не разграничена) и внесения данных изменений Росреестром в ЕГРН до начала налогового периода (до 31 декабря) (
                    - link "подробнее" [ref=f7e210] [cursor=pointer]:
                      - /url: https://www.mos.ru/dgi/function/gosudarstvennye-uslugi/izmenenie-razreshennogo-ispolzovaniia-zemelnogo-uchastka/
                    - text: ),
                - listitem [ref=f7e211]:
                  - paragraph [ref=f7e212]:
                    - text: если изменение вида разрешенного использования нецелесообразно либо вы не успели оформить документы в срок, позволяющий исключить объект из Перечня, но при этом объект недвижимости фактически используется для вышеуказанных видов деятельности менее чем на 20% площади, вы можете заявить
                    - link "льготу" [ref=f7e213] [cursor=pointer]:
                      - /url: https://www.mos.ru/depr/function/nalogovaya-politika/nalog-ot-kadastrovoj-stoimosti/kadastr-tax-credits
                    - text: ", снижающую налог в четыре раза.Для применения льготы за налоговый период (год) нужно обратиться до 30 апреля текущего года в Госинспекцию по недвижимости для составления акта обследования до 30 июня."
              - paragraph [ref=f7e214]
              - paragraph [ref=f7e215]: "В случае если объект недвижимости был включен в Перечень по акту Госинспекции по недвижимости как фактически использующийся не менее чем на 20% общей площади для размещения офисов, объектов торговли, бытового обслуживания или общественного питания, вы можете:"
              - list [ref=f7e216]:
                - listitem [ref=f7e217]:
                  - paragraph [ref=f7e218]:
                    - text: в случае несогласия с актом — обратиться в
                    - link "Департамент экономической политики и развития города Москвы" [ref=f7e219] [cursor=pointer]:
                      - /url: https://www.mos.ru/depr/function/nalogovaya-politika/nalog-ot-kadastrovoj-stoimosti/rassmotrenie-voprosov-nalogooblozheniya-nalogom-na-imushestvo/
                    - text: для рассмотрения вашего заявления на комиссии с целью составления Госинспекцией по недвижимости повторного акта, подтверждающего отсутствие данных видов использования объекта. С заявлением можно обратиться
                    - strong [ref=f7e220]: в течение года
                    - text: ", в котором составлен акт, и"
                    - strong [ref=f7e221]: в течение 90 календарных дней
                    - text: следующего за ним года;
                - listitem [ref=f7e222]:
                  - paragraph [ref=f7e223]:
                    - text: в случае если акт был составлен корректно, но с даты его составления фактическое использование объекта изменилось и сейчас он используется для вышеуказанных видов деятельности менее чем на 20% общей площади, рекомендуем обратиться в Департамент экономической политики и развития города Москвы для рассмотрения вашего заявления на комиссии с целью составления Госинспекцией по недвижимости акта, подтверждающего отсутствие данных видов использования объекта, до начала налогового периода (до 31 декабря) (
                    - link "подробнее" [ref=f7e224] [cursor=pointer]:
                      - /url: https://www.mos.ru/depr/function/nalogovaya-politika/nalog-ot-kadastrovoj-stoimosti/rassmotrenie-voprosov-nalogooblozheniya-nalogom-na-imushestvo/
                    - text: ).
              - paragraph [ref=f7e225]
              - paragraph [ref=f7e226]: Если объект недвижимости включен в Перечень одновременно по нескольким критериям и вы с ними не согласны, то необходимо осуществить все применимые действия, описанные выше в подпунктах 2 и 3.
              - paragraph [ref=f7e227]
              - paragraph [ref=f7e228]:
                - strong [ref=f7e229]: Что дальше?
              - paragraph [ref=f7e230]:
                - text: Если в результате вышеуказанных действий ваш объект перестал соответствовать критериям налогообложения от кадастровой стоимости, он будет исключен из Перечня (с 1 января) и обновленные сведения будут учтены при разработке Перечней последующих лет.Если сроки действий, описанных выше в пунктах 2 и 3, были пропущены, рекомендуем до начала процесса формирования Перечня на следующий год (до 30 сентября) привести документы в порядок, чтобы ваш объект недвижимости не был включен в Перечни последующих лет. Кроме того, вы можете рассмотреть возможность снижения налога путем применения различных
                - link "льгот" [ref=f7e231] [cursor=pointer]:
                  - /url: https://www.mos.ru/depr/function/nalogovaya-politika/nalog-ot-kadastrovoj-stoimosti/kadastr-tax-credits/
                - text: .

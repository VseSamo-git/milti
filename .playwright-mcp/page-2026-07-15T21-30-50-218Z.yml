          - heading "Условия использования" [level=2] [ref=f53e52]
          - generic [ref=f53e53]: Портал data.mos.ru является официальным Порталом открытых данных Правительства города Москвы. Все материалы портала data.mos.ru являются открытыми данными в соответствии с требованием постановления Правительства РФ N 583 от 10 июля 2013 г. и могут быть воспроизведены в любых средствах массовой информации в информационно–телекоммуникационной сети Интернет или на любых иных носителях без каких-либо ограничений по объему и срокам публикации. Это разрешение в равной степени распространяется на газеты, журналы, радиостанции, телеканалы, сайты и страницы сети Интернет.
          - generic [ref=f53e54]: Перепечатка или ретрансляция данных возможна при условии ссылки на Портал открытых данных. Сведения о коммерческих структурах города Москвы, представленные на портале data.mos.ru, получены из открытого доступа, в т.ч. посредством сети Интернет. Данные о коммерческих структурах, размещенные на портале data.mos.ru, не являются рекламой, а имеют исключительно информативный характер. Данные о коммерческих структурах, размещенные на портале data.mos.ru, могут корректироваться администратором Портала на основании жалоб и сообщений граждан, а также на основании информации, полученной своими силами и за свой счет.
          - generic [ref=f53e55]: Любой пользователь Портала в случае обнаружения в предоставляемых данных неточностей или ошибок, включая информацию о доступности объектов инфраструктуры для людей с ограниченными возможностями, вправе обратиться с жалобой в соответствии с установленным регламентом. Жалоба подается путем заполнения соответствующей формы на портале data.mos.ru.

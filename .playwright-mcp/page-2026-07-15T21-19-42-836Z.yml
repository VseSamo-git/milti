          - iframe [ref=f38e98]:
            - generic [ref=f46e2]:
              - generic [ref=f46e3]:
                - heading "Включен ли ваш объект в утвержденный перечень объектов недвижимости" [level=1] [ref=f46e4]
                - paragraph [ref=f46e5]: Сервис для поиска объектов недвижимого имущества, по которым налог на имущество исчисляется от кадастровой стоимости
                - paragraph [ref=f46e6]: Уважаемые налогоплательщики!
                - paragraph [ref=f46e7]: Данный сервис предназначен для поиска объектов недвижимого имущества, включенных в Перечень торговых, офисных объектов, объектов общественного питания и (или) бытового обслуживания, облагаемых налогом на имущество от кадастровой стоимости.
                - paragraph [ref=f46e8]: "В случае если Вам принадлежит:"
                - paragraph [ref=f46e9]:
                  - list [ref=f46e10]:
                    - listitem [ref=f46e11]: • нежилое здание, поиск осуществляется по кадастровому номеру здания;
                    - listitem [ref=f46e12]: • нежилое помещение в нежилом здании, поиск осуществляется по кадастровому номеру здания, в котором расположено данное помещение;
                    - listitem [ref=f46e13]: • встроенно-пристроенное нежилое помещение в многоквартирном доме, поиск осуществляется по кадастровому номеру помещения.
                - paragraph [ref=f46e14]: В настоящее время в данном сервисе содержатся утвержденные Перечни на 2014 – 2026 годы.
                - paragraph [ref=f46e15]:
                  - text: Ознакомиться с критериями, по которым объекты недвижимости включаются в Перечень, порядком налогообложения, ставками, льготами по налогу на имущество от кадастровой стоимости можно на официальном сайте Мэра Москвы в разделе
                  - link "Власть // Органы власти // Департамент экономической политики и развития города Москвы // Деятельность // Налог на имущество организаций от кадастровой стоимости" [ref=f46e16] [cursor=pointer]:
                    - /url: https://www.mos.ru/depr/function/nalogovaya-politika/nalog-ot-kadastrovoj-stoimosti/
                - paragraph [ref=f46e17]:
                  - text: Актуальные вопросы и практика применения налога на имущество, уплачиваемого от кадастровой стоимости, обобщены в брошюре, опубликованной
                  - link "здесь" [ref=f46e18] [cursor=pointer]:
                    - /url: https://www.mos.ru/upload/content/files/Noviiporyadokraschetanaloganaimyshestvo_31-01-2021(2).pdf
                  - text: .
                - paragraph [ref=f46e19]: Проверьте, находится ли Ваш объект в Перечне на 2026 год! Ваши возможные дальнейшие действия в этой связи см. ниже.
                - generic [ref=f46e20] [cursor=pointer]: Перейти к поиску
                - generic [ref=f46e21]:
                  - heading "Часто задаваемые вопросы" [level=3] [ref=f46e22]
                  - list [ref=f46e23]:
                    - listitem [ref=f46e24]: Как пользоваться сервисом?
                    - listitem [ref=f46e25]: Какие объекты включены в Перечень на 2026 год? • • •
                    - listitem [ref=f46e26]: Как определить, по какому критерию объект был включен в Перечень на 2026 год?
                    - listitem [ref=f46e27]: Что делать, если Вы не согласны с включением объекта недвижимости в Перечень на 2026 год? • • • • •
                    - listitem [ref=f46e28]: Какими льготами я могу воспользоваться в отношении объектов, включенных в Перечень?
